name: Bug report
description: Report a defect in Halo
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. For security vulnerabilities, do **not** use
        this template — follow the private process in `docs/SECURITY.md`.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the defect and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps or a sample config / request that reproduces the issue.
      placeholder: |
        1. Start Halo with ...
        2. Send ...
        3. See ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Halo version
      description: Output of `halo --version` or the commit SHA.
      placeholder: v1.0.0 / commit SHA
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows (Docker / WSL)
        - Other
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Run mode
      options:
        - observe
        - guard
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / screenshots
      description: Redact any secrets, tokens, or personal data before pasting.
      render: shell
